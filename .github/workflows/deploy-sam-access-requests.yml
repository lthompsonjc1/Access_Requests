name: Deploy Access Requests (SAM)

on:
  workflow_dispatch:
  push:
    branches: [master, circuit-access-requests-demo, access-requests-list-page]
    paths:
      - 'infra/**'
      - 'backend/**'
      - 'scripts/deploy-sam.sh'
      - 'scripts/deploy-access-requests-r2.sh'
      - 'vite.config.access-requests.ts'
      - 'src/stories/projects/access-requests/**'
      - 'src/public-demos/**'
      - '.github/workflows/deploy-sam-access-requests.yml'

permissions:
  id-token: write
  contents: read

env:
  ACCESS_REQUESTS_API_URL: https://5o4efrj7o1.execute-api.us-west-2.amazonaws.com

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      AWS_REGION: us-west-2
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::642920845081:role/GithubActionsCI-circuit-playground
          role-session-name: GithubActionsSamDeploy

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain jumpcloud-artifacts --query authorizationToken --output text)
          npm install -g pnpm
          pnpm config set "//jumpcloud-artifacts-642920845081.d.codeartifact.us-east-2.amazonaws.com/npm/jumpcloud-node-modules/:_authToken" "${CODEARTIFACT_AUTH_TOKEN}"
          pnpm install --frozen-lockfile

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: Deploy AWS stack and S3 assets
        run: bash scripts/deploy-sam.sh

  deploy-public:
    runs-on: ubuntu-latest
    needs: deploy-api
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::642920845081:role/GithubActionsCI-circuit-playground
          role-session-name: GithubActionsR2Deploy

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain jumpcloud-artifacts --query authorizationToken --output text)
          npm install -g pnpm
          pnpm config set "//jumpcloud-artifacts-642920845081.d.codeartifact.us-east-2.amazonaws.com/npm/jumpcloud-node-modules/:_authToken" "${CODEARTIFACT_AUTH_TOKEN}"
          pnpm install --frozen-lockfile

      - name: Publish HTTPS demo to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_REF: latest
        run: |
          npm install -g wrangler
          sudo apt-get install -y rclone -qq
          bash scripts/deploy-access-requests-r2.sh
