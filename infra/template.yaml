AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Circuit Access Requests demo — S3 static site + API (Lambda/DynamoDB)

Parameters:
  ProjectName:
    Type: String
    Default: circuit-access-requests

Globals:
  Function:
    Timeout: 15
    Runtime: nodejs20.x
    MemorySize: 256
    Architectures:
      - arm64

Resources:
  DemoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: src/handler.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref DemoTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DemoTable
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
        PreferencesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /preferences
            Method: GET
        PreferencesPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /preferences
            Method: PUT
        SavedViewsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /saved-views
            Method: GET
        SavedViewsPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /saved-views
            Method: PUT
        OptionsPreferences:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /preferences
            Method: OPTIONS
        OptionsSavedViews:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /saved-views
            Method: OPTIONS

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - PUT
          - OPTIONS
        MaxAge: 600

  # Public website hosting (no CloudFront) so deploy works with narrower IAM roles.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'

Outputs:
  WebsiteUrl:
    Description: S3 website URL for the Access Requests demo
    Value: !GetAtt SiteBucket.WebsiteURL
  CloudFrontUrl:
    Description: Compatibility output (same as WebsiteUrl; stack has no CloudFront)
    Value: !GetAtt SiteBucket.WebsiteURL
  ApiUrl:
    Description: HTTP API base URL
    Value: !GetAtt HttpApi.ApiEndpoint
  SiteBucketName:
    Description: S3 bucket for static assets
    Value: !Ref SiteBucket
  DistributionId:
    Description: Unused without CloudFront (empty string)
    Value: ''
  TableName:
    Description: DynamoDB table name
    Value: !Ref DemoTable
