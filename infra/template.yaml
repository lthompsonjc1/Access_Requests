AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Circuit Access Requests demo — static site (S3/CloudFront) + API (Lambda/DynamoDB)

Parameters:
  ProjectName:
    Type: String
    Default: circuit-access-requests

Globals:
  Function:
    Timeout: 15
    Runtime: nodejs20.x
    MemorySize: 256
    Architectures:
      - arm64

Resources:
  DemoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: src/handler.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref DemoTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DemoTable
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
        PreferencesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /preferences
            Method: GET
        PreferencesPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /preferences
            Method: PUT
        SavedViewsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /saved-views
            Method: GET
        SavedViewsPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /saved-views
            Method: PUT
        OptionsPreferences:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /preferences
            Method: OPTIONS
        OptionsSavedViews:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /saved-views
            Method: OPTIONS
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - PUT
          - OPTIONS
        MaxAge: 600

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  CloudFrontUrl:
    Description: CloudFront URL for the Access Requests demo
    Value: !Sub 'https://${SiteDistribution.DomainName}'
  ApiUrl:
    Description: HTTP API base URL
    Value: !GetAtt HttpApi.ApiEndpoint
  SiteBucketName:
    Description: S3 bucket for static assets
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref SiteDistribution
  TableName:
    Description: DynamoDB table name
    Value: !Ref DemoTable
